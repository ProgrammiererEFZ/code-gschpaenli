# Plugin coordinates. `pluginVersion` is the single source of truth for the plugin version (see CHANGELOG.md).
pluginGroup = io.github.programmiererefz.codegschpaenli
pluginVersion = 0.1.0
pluginRepositoryUrl = https://github.com/ProgrammiererEFZ/code-gschpaenli

# IntelliJ IDEA Community version the plugin is compiled against, downloaded by Gradle (also on CI).
# Keep it on the lowest supported major (sinceBuild 252 = 2025.2); IntelliJ IDEA 2025.3+ is a unified distribution.
platformVersion = 2025.2.6.4

# Optional: compile and run against a locally installed IDE instead of downloading one.
# Better set it in ~/.gradle/gradle.properties or pass it on the command line: -PlocalIde="C:/Program Files/JetBrains/..."
#localIde = C:/Program Files/JetBrains/IntelliJ IDEA Community Edition 2025.2

# Optional: run the IntelliJ Plugin Verifier against local IDEs instead of downloading them (comma-separated).
#localVerifierIdes = C:/Program Files/JetBrains/IntelliJ IDEA Community Edition 2025.2,C:/Program Files/JetBrains/PhpStorm 2026.2.3

# Opt-out flag for bundling the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
# Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
